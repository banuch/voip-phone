#!KAMAILIO
#
# Wintek SIP edge - STAGE 2 registrar (20,000+ ATMs, HA).
#
# Reference configuration: review and load-test before production. Roles:
#  * SIP edge + registrar for ATM intercoms (UDP/TLS), digest auth against the
#    `kamailio_subscriber` view (HA1 only), contacts in usrloc (db_mode=2 so a
#    restarted node keeps registrations).
#  * Reports every registration change to the API webhook
#    (POST /api/v1/internal/sip/registrations) asynchronously.
#  * Relays Asterisk's calls to the registered ATM contact. ATMs may NOT
#    originate calls (V1.1): INVITEs from ATMs are rejected with 403.
#  * Pike + htable flood protection.
#
#!define DBURL "postgres://kamailio_ro:KAMAILIO_DB_PASSWORD@postgres/wintek"
#!define WEBHOOK "http://api:3000/api/v1/internal/sip/registrations"
#!define WEBHOOK_SECRET "INTERNAL_WEBHOOK_SECRET"
#!define ASTERISK_NET "172.20.0.0/16"

debug=2
log_stderror=yes
children=8
listen=udp:0.0.0.0:5060
listen=tcp:0.0.0.0:5060
tcp_connection_lifetime=3605
server_header="Server: Wintek-Edge"
user_agent_header="User-Agent: Wintek-Edge"

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "db_postgres.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "nathelper.so"
loadmodule "pike.so"
loadmodule "htable.so"
loadmodule "permissions.so"
loadmodule "http_async_client.so"
loadmodule "jansson.so"
loadmodule "xhttp_prom.so"

modparam("usrloc", "db_url", DBURL)
modparam("usrloc", "db_mode", 2)
modparam("usrloc", "timer_interval", 30)
modparam("registrar", "max_contacts", 1)
modparam("registrar", "max_expires", 600)
modparam("registrar", "default_expires", 300)
modparam("auth_db", "db_url", DBURL)
modparam("auth_db", "user_column", "username")
modparam("auth_db", "domain_column", "domain")
modparam("auth_db", "password_column", "ha1")
modparam("auth_db", "calculate_ha1", 0)
modparam("auth_db", "load_credentials", "")
modparam("auth_db", "use_domain", 1)
modparam("nathelper", "natping_interval", 25)
modparam("nathelper", "sipping_bflag", 7)
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)
modparam("htable", "htable", "ipban=>size=8;autoexpire=300;")
modparam("http_async_client", "workers", 2)

request_route {
	if (!mf_process_maxfwd_header("10")) { sl_send_reply("483", "Too Many Hops"); exit; }
	if (!sanity_check()) exit;

	if ($sht(ipban=>$si) != $null) exit;
	if (!src_ip == ASTERISK_NET && !pike_check_req()) {
		$sht(ipban=>$si) = 1;
		xlog("L_WARN", "flood from $si, banned for 5 min\n");
		exit;
	}

	if (is_method("OPTIONS") && uri == myself) { sl_send_reply("200", "OK"); exit; }

	if (has_totag()) {
		if (loose_route()) { t_relay(); exit; }
		if (is_method("ACK") && t_check_trans()) { t_relay(); exit; }
		sl_send_reply("404", "Not here"); exit;
	}

	if (is_method("REGISTER")) { route(REGISTRAR); exit; }

	if (is_method("INVITE")) {
		# Only the Asterisk media tier may place calls; ATMs never originate (V1.1).
		if (!src_ip == ASTERISK_NET) { sl_send_reply("403", "Calls are operator-initiated only"); exit; }
		record_route();
		if (!lookup("location")) { t_reply("480", "ATM not registered"); exit; }
		t_relay();
		exit;
	}
	if (is_method("CANCEL") && t_check_trans()) { t_relay(); exit; }
	sl_send_reply("405", "Method not allowed");
}

route[REGISTRAR] {
	if (!www_authorize("$td", "kamailio_subscriber")) { www_challenge("$td", "1"); exit; }
	if ($au != $tU) { sl_send_reply("403", "Auth user mismatch"); exit; }
	consume_credentials();
	fix_nated_register();
	setbflag(7);
	if (!save("location")) { sl_reply_error(); exit; }
	# Only real state changes need the API; refreshes are cheap and still update last_seen there.
	$var(state) = "REGISTERED";
	if ($hdr(Expires) == "0" || $(ct{tobody.params}{param.value,expires}) == "0") $var(state) = "UNREGISTERED";
	route(NOTIFY_API);
}

route[NOTIFY_API] {
	$http_req(all) = $null;
	$http_req(method) = "POST";
	$http_req(timeout) = 2000;
	$http_req(hdr) = "Content-Type: application/json";
	$http_req(hdr) = "X-Wintek-Internal-Secret: " + WEBHOOK_SECRET;
	$http_req(body) = '{"username":"' + $tU + '","state":"' + $var(state) + '","contactIp":"' + $si + '","contactPort":' + $sp + ',"userAgent":"' + $(ua{s.escape.common}) + '"}';
	http_async_query(WEBHOOK, "NOTIFY_DONE");
}

route[NOTIFY_DONE] {
	if ($http_ok != 1 || $http_rs >= 300) xlog("L_WARN", "registration webhook failed: $http_err $http_rs\n");
}

# Contact expiry (device vanished without unregistering) also notifies the API.
event_route[usrloc:contact-expired] {
	$var(state) = "EXPIRED";
	$tU = $ulc(exp=>aor);
	route(NOTIFY_API);
}

event_route[xhttp:request] {
	if ($hu =~ "^/metrics") { prom_dispatch(); exit; }
	xhttp_reply("404", "Not Found", "text/plain", "");
}
