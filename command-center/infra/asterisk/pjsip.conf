; Wintek SIP Command Center - Asterisk PJSIP (media / call-control node)
;
; Endpoints, auths and AORs for ATMs and operator browsers come from
; PostgreSQL views (sorcery.conf); this file only holds transports and the
; optional Kamailio trunk used in stage 2.

[global]
type=global
user_agent=Wintek-Media
endpoint_identifier_order=auth_username,username,ip

; ATM intercoms (ESP32-S3) - plain SIP/RTP, G.711. Restrict at the firewall to
; ATM network ranges / VPN. TLS+SRTP can be enabled per site where firmware allows.
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_media_address=${EXTERNAL_IP}
external_signaling_address=${EXTERNAL_IP}
local_net=10.0.0.0/8
local_net=172.16.0.0/12
local_net=192.168.0.0/16

; Operator browsers - SIP over secure WebSocket (http.conf serves wss on 8089).
[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0

; ---- Stage 2 only: ATMs register to Kamailio; Asterisk reaches them through it.
; Uncomment and set the API's ATM_DIAL_MODE=kamailio.
;[kamailio]
;type=endpoint
;transport=transport-udp
;context=atms
;disallow=all
;allow=ulaw,alaw
;aors=kamailio
;direct_media=no
;[kamailio]
;type=aor
;contact=sip:kamailio:5060
;[kamailio]
;type=identify
;endpoint=kamailio
;match=kamailio
