[general]
enabled=yes
pretty=no
; Browser origins are not needed: only the API talks to ARI, over the internal network.
allowed_origins=

[wintek]
type=user
read_only=no
password=${ARI_PASSWORD}

; Read-only user for desktop softphones (Wintek Softphone "Directory server"):
; they only list endpoints (GET /ari/endpoints) to show who is online.
; Created only when ARI_PHONE_PASSWORD is set (docker-entrypoint.sh removes it
; otherwise), so keep this section LAST in the file.
[phone]
type=user
read_only=yes
password=${ARI_PHONE_PASSWORD}
