; Operator browsers dial  sip:call-<callId>@<domain>  with header X-Wintek-Call-Token.
; Every such INVITE goes straight into the ARI application; the API validates
; the call id, the one-time token and that the caller is the reserving
; operator, then originates the ATM leg. Nothing else is routable.
[operators]
exten => _call-.,1,NoOp(Wintek call ${EXTEN:5} from ${CHANNEL(endpoint)})
 same => n,Stasis(wintek,operator,${EXTEN:5},${PJSIP_HEADER(read,X-Wintek-Call-Token)})
 same => n,Hangup()
exten => _X.,1,Hangup(21)
exten => _[a-zA-Z].,1,Hangup(21)

; ATMs never originate calls in V1.1.
[atms]
exten => _X.,1,Hangup(21)
exten => _[a-zA-Z].,1,Hangup(21)
