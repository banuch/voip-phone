# Reverse proxy: TLS termination, static dashboard, API, WebSocket.
# Internal-only routes (registrar webhook, metrics) are never exposed.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream wintek_api { least_conn; server api:3000 max_fails=3 fail_timeout=10s; keepalive 32; }

server {
  listen 80;
  server_name _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;
  ssl_certificate     /etc/nginx/tls/fullchain.pem;
  ssl_certificate_key /etc/nginx/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:SSL:10m;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
  # connect-src must allow the WebRTC signalling host (wss to Asterisk/Kamailio).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss://$host wss://sip.$host; media-src 'self' blob:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;

  client_max_body_size 12m; # CSV import

  location = /api/v1/internal { return 404; }
  location ^~ /api/v1/internal/ { return 404; }
  location = /metrics { return 404; }

  location /api/ {
    proxy_pass http://wintek_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 30s;
  }

  location /ws {
    proxy_pass http://wintek_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
  }
}
