[general]
enabled=yes
; ARI on the internal network only.
bindaddr=0.0.0.0
bindport=8088
; WSS for operator browsers (terminate TLS here, or at the reverse proxy and forward /ws).
tlsenable=yes
tlsbindaddr=0.0.0.0:8089
tlscertfile=/etc/asterisk/keys/asterisk.crt
tlsprivatekey=/etc/asterisk/keys/asterisk.key
